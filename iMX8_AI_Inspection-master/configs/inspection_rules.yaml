# Inspection Rule Configuration
# ================================
# แก้ไขค่าตรงนี้ได้โดยไม่ต้องแตะ code

rules:
  # ---------------------------------------------------------
  # [เกณฑ์การตัดสินชิดขอบ]
  # ---------------------------------------------------------
  # ระยะห่างขั้นต่ำจาก probemark ถึงขอบ pad (ในหน่วยไมครอน um)
  # - หากต้องการใช้เกณฑ์พิกเซลแบบเดิม ให้ตั้ง default_px_per_um เป็น 1.0
  fail_distance_um: 8.0

  # ช่วง warning เพิ่มเติมจาก fail threshold (ตั้งเป็น 0.0 เพื่อปิด)
  warning_distance_um: 0.0

  # จำนวนครั้งที่ต้องเกิด warning ก่อนแสดงผล
  warning_occurrence_threshold: 1

  # ---------------------------------------------------------
  # [เกณฑ์สัดส่วนพื้นที่]
  # ---------------------------------------------------------
  # สัดส่วนพื้นที่สูงสุดของ probemark ต่อ pad (%) -> เกินนี้ FAIL (ของเดิมคือ 25%)
  max_area_ratio_pct: 25.0

  # สัดส่วนพื้นที่ต่ำสุดของ probemark ต่อ pad (%) -> ต่ำกว่านี้ FAIL (ตั้งเป็น 0.0 เพื่อปิด)
  min_area_ratio_pct: 0.0

  # กรณีไม่มี probemark บน pad: "warning" หรือ "fail"
  missing_mark_action: "fail"

  # % overlap ขั้นต่ำของ probemark ที่ต้องทับกับ pad จึงจะตรวจ
  min_overlap_pct: 0.5

  # ROI (Region of Interest) เพื่อกรองและละเว้น pad/probemark ที่อยู่ติดขอบภาพ
  # ตั้งเป็น 1.0 เพื่อปิด (ตรวจเต็มภาพ) ของเดิมจาก U-Net คือ 0.7
  v_roi: 0.7
  h_roi: 0.7

  # ขนาดพื้นที่พิกเซลต่ำสุดในการคัดกรองขยะ/สัญญาณรบกวน (Min Area Filter)
  # [pad_min_area, probemark_min_area, grain_min_area]
  min_area_sizes: [300, 10, 5]

  # เกณฑ์ความเข้มเฉลี่ยของรอยกดเข็ม (Greyscale darkness, ตั้งเป็น 0.0 เพื่อปิด)
  greyscale_threshold: 0.0

calibration:
  # ---------------------------------------------------------
  # [การปรับสเกลภาพและการวัดขนาด]
  # ---------------------------------------------------------
  # ความกว้างจริงของ pad ในหน่วยไมครอน um (ใส่ null หากต้องการตรวจจับด้วยหน่วยพิกเซลแบบเดิม)
  pad_width_um: null

  # ค่าพิกเซลต่อไมครอน (px per um)
  # - ตั้งเป็น 1.0 หากต้องการให้เกณฑ์ fail_distance_um ทำงานเป็นหน่วยพิกเซลโดยตรง (1 px = 1 unit)
  default_px_per_um: 1.0

  # ขนาดภาพเป้าหมายเพื่อย่อสเกลพิกัดไปตัดสิน (เลียนแบบ U-Net 160x160)
  # - ใส่ตัวเลขเพื่อย่อขนาดพิกัดไปคิดตัดสินที่ความละเอียดเป้าหมาย (เช่น 160)
  # - ใส่ null หากต้องการตัดสินบนความละเอียดภาพจริงโดยตรง
  target_width: 160
  target_height: 160
